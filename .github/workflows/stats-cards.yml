name: Update GitHub stats cards

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyo_night&hide_border=true&bg_color=0d1117&title_color=70a5fd&icon_color=bb9af7&text_color=c9d1d9&ring_color=70a5fd&disable_animations=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyo_night&hide_border=true&bg_color=0d1117&title_color=70a5fd&text_color=c9d1d9&langs_count=8&disable_animations=true
          path: assets/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate streak card
        run: |
          tmp="$(mktemp)"
          curl -fsSL --max-time 30 \
            "https://streak-stats.demolab.com?user=${GITHUB_REPOSITORY_OWNER}&theme=tokyo-night&hide_border=true&background=0d1117&ring=70a5fd&fire=bb9af7&currStreakLabel=70a5fd&disable_animations=true" \
            -o "$tmp"
          grep -q '<svg' "$tmp"
          cp "$tmp" assets/streak.svg

      - name: Make card text visible without CSS animation
        run: python3 scripts/unhide-stats-svg.py assets/stats.svg assets/langs.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/streak.svg
          git commit -m "Update GitHub stats cards" || exit 0
          git push
